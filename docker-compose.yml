services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poker_club
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - poker-club-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poker_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poker-club-postgres:
